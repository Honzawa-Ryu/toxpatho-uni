[project]
name = "toxpatho-uni"
version = "0.1.0"
description = "Domain adaptation of pathology foundation models (UNI / UNI2) to toxicologic pathology"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    # --- core numerics / data ---
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "h5py",
    # --- deep learning ---
    "torch==2.11.0+cu130",
    "torchvision",
    "timm",                 # UNI / UNI2 の ViT 実装
    "einops",
    "peft",                 # LoRA
    "accelerate",
    "safetensors",
    "huggingface-hub",
    "transformers",
    # --- imaging ---
    "pillow",
    "opencv-python-headless",
    # --- experiment tracking / viz ---
    "wandb",
    "tqdm",
    "matplotlib",
    "seaborn",
    "plotly",
    # --- notebooks / misc ---
    "jupyterlab",
    "ipython",
    "notebook",
    "python-dotenv",
    "psutil",
    "pynvml",
    "slackweb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# lib をパッケージとして認識させる設定
[tool.hatch.build.targets.wheel]
packages = ["lib"]

# pytorch index url
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# strict pytorch to be installed from "pytorch-cu130"
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
